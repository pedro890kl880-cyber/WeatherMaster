name: Build Weather Master iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        # Como o pubspec.yaml está na raiz (onde o git faz o checkout), corre diretamente aqui

      - name: Verify Flutter environment
        run: flutter doctor

      - name: Build iOS App (Runner)
        run: flutter build ios --release --no-codesign
