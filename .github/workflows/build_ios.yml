name: Build iOS Weather Master

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Localizar pasta real do projeto e compilar
        run: |
          # Procura a pasta exata onde o pubspec.yaml realmente está escondido
          PROJECT_DIR=$(dirname "$(find . -name "pubspec.yaml" -not -path "*/.*" -print -quit)")
          echo "Pasta encontrada: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build ios --release --no-codesign
          
          # Prepara o artefacto
          mkdir -p /tmp/artifact
          cp -R build/ios/iphoneos/Runner.app /tmp/artifact/

      - name: Guardar o ficheiro gerado
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: /tmp/artifact/Runner.app
