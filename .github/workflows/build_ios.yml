name: Build iOS Weather Master

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java (necessário para dependências do Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Instalar dependências do projeto
        run: |
          # Procura automaticamente pela pasta que contém o ficheiro pubspec.yaml
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 3 -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Compilar app para iOS (modo release sem assinatura)
        run: |
          cd "${{ env.PROJECT_DIR }}"
          flutter build ios --release --no-codesign

      - name: Comprimir a build para descarregar
        run: |
          cd "${{ env.PROJECT_DIR }}/build/ios/iphoneos"
          zip -r Runner.zip Runner.app

      - name: Guardar o ficheiro gerado
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: ${{ env.PROJECT_DIR }}/build/ios/iphoneos/Runner.zip
